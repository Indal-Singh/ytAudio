services:
  web:
    build: .
    container_name: ytaudio
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    volumes:
      # Host source → container (live code changes)
      - .:/app
      # Keep container node_modules (host mount se overwrite na ho)
      - /app/node_modules
      # Optional: Next.js cache host pe persist
      - next_cache:/app/.next
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      HOSTNAME: "0.0.0.0"
      YTDLP_PATH: ${YTDLP_PATH:-yt-dlp}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev
    restart: unless-stopped

volumes:
  next_cache:
