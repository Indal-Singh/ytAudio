<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="50%" stop-color="#e60026" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.6" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Card with gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Audio Wave Bars / Music Glyph -->
  <!-- Left Note Head -->
  <ellipse cx="23" cy="42" rx="6" ry="4.5" transform="rotate(-20 23 42)" fill="#ffffff" />
  <!-- Left Stem -->
  <rect x="26" y="20" width="3.5" height="23" rx="1.75" fill="#ffffff" />

  <!-- Right Note Head -->
  <ellipse cx="43" cy="38" rx="6" ry="4.5" transform="rotate(-20 43 38)" fill="#ffffff" />
  <!-- Right Stem -->
  <rect x="46" y="16" width="3.5" height="23" rx="1.75" fill="#ffffff" />

  <!-- Connecting Beam -->
  <polygon points="26,20 49.5,16 49.5,23 26,27" fill="#ffffff" />

  <!-- Glowing Cyan Live Indicator Dot -->
  <circle cx="50" cy="14" r="5" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="50" cy="14" r="2.5" fill="#ffffff" />
</svg>
